# KataGo GTP config for the daoqi (torus go) model in this folder.
# Used by ../daoqi_gui.py:  katago gtp -model model.bin.gz -config gtp_daoqi.cfg
#
# Key set follows the official gtp_example.cfg (GTP mode requires these);
# values chosen for watching AI games: resignation off, BLACK-perspective
# winrate / scoreLead, no pondering.

logDir = gtp_logs
logAllGTPCommunication = false
logSearchInfo = false
logSearchInfoForChosenMove = false
logToStderr = false

rules = chinese
allowResignation = false
resignThreshold = -0.90
resignConsecTurns = 3
maxVisits = 64            # default cap; AI moves override per call
ponderingEnabled = false
maxTimePondering = 60.0
lagBuffer = 1.0
numSearchThreads = 8
searchFactorAfterOnePass = 0.50
searchFactorAfterTwoPass = 0.25
searchFactorWhenWinning = 0.40
searchFactorWhenWinningThreshold = 0.95

nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 21
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true

reportAnalysisWinratesAs = BLACK
conservativePass = true
