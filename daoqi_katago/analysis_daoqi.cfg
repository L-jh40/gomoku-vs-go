# KataGo analysis config for the daoqi (torus go) model bundled in this folder.
# Based on KataGo v1.18 analysis_example.cfg + katrain_daoqi settings.

logDir = analysis_logs
reportAnalysisWinratesAs = BLACK

# One analysis query at a time (the GUI client serialises queries anyway).
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 10

maxVisits = 500
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 21
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true

# Keep the engine playing until the position is really settled.
conservativePass = true
allowResignation = false
